<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp automation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <a href="second-page.html" style="color: var(--primary); text-decoration: none; font-family: var(--font-mono); font-size: 0.85rem; border: 1px solid var(--border); padding: 5px 12px; border-radius: 6px; transition: 0.3s;">Send Message →</a>
        </header>

        <main class="main-content">
            <section class="messages-section panel">
                <div class="panel-header">
                    <h2><i class="icon"> Received Messages</h2>
                </div>
                <div class="messages-box" id="messages-box">
                    <div class="empty">
                        <div class="spinner"></div>
                        Waiting for messages...
                    </div>
                </div>
            </section>

            <section class="reply-section panel">
                <div class="panel-header">
                    <h2><i class="icon"></i> Send Reply</h2>
                </div>
                <div class="form-group">
                    <label for="reply-to">Phone Number</label>
                    <input type="text" id="reply-to" placeholder="e.g., +1234567890" />
                </div>
                <div class="form-group">
                    <label for="reply-message">Message</label>
                    <textarea id="reply-message" placeholder="Type your message..." rows="3"></textarea>
                </div>
                <div class="action-row">
                    <button id="send-btn" class="btn-primary">
            <span class="btn-text">Send Message</span>
            <span class="btn-glow"></span>
          </button>
                    <p id="reply-status" class="status"></p>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
