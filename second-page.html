<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp automation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="app-header" style="margin-bottom: 20px; padding: 0;">
            <div class="logo">

                <a href="index.html" style="color: var(--primary); text-decoration: none; font-family: var(--font-mono); font-size: 0.85rem; border: 1px solid var(--border); padding: 5px 12px; border-radius: 6px; transition: 0.3s;">← Receive Messages</a>
            </div>
        </header>

        <main class="card">
            <div class="card-header">
                <div class="icon-container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="whatsapp-icon">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
            </path>
          </svg>
                </div>
                <h1>Send Message</h1>
                <p>Select a contact to send a predefined WhatsApp message.</p>
            </div>

            <form id="whatsappForm" class="contact-form">
                <div class="form-group">
                    <label for="contactSelect">Select Recipient</label>
                    <div class="select-wrapper">
                        <select id="contactSelect" name="contact" required>
              <option value="" disabled selected>Choose a contact...</option>
              <option value="user_a" data-name="Support Team" data-phone="+91 88074 56546"
                data-message="Hello Support, I need help with my account.">Support Team</option>
              <option value="user_b" data-name="Sales Department" data-phone="+91 80723 74206"
                data-message="Hi Sales, I would like to request a quote.">Sales Department</option>
              <option value="user_c" data-name="Technical Lead" data-phone="+91 89254 22722"
                data-message="Hey Tech Lead, we have a system notification.">Technical Lead</option>
            </select>
                        <svg class="select-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
                    </div>
                </div>

                <div class="preview-box" id="messagePreview" style="display: none;">
                    <strong>Message Preview:</strong>
                    <p id="previewText"></p>
                </div>

                <button type="submit" class="submit-btn" id="sendBtn">
          <span>Send</span>
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="custom-message-section">
                <div class="form-group">
                    <label for="customNumber">Custom Phone Number</label>
                    <input type="tel" id="customNumber" placeholder="+1234567890" class="custom-input">
                </div>
                <div class="form-group">
                    <label for="customMessage">Custom Message</label>
                    <textarea id="customMessage" placeholder="Enter your message here..." class="custom-input" rows="3"></textarea>
                </div>
                <button type="button" class="submit-btn custom-btn" id="customSendBtn">
          <span>Send</span>
                     <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
            </path>
          </svg>
        </button>
            </div>

            <div id="statusMessage" class="status-message"></div>
    </div>
    </main>
    </div>
    <script src="second-page.js"></script>
</body>

</html>
